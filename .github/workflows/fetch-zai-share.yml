name: Fetch ZAI Share Source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public conversation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SHARE_ID='8d6d58cc-f6ae-4e24-81bf-c4ff094e1401'
          BASE='https://chat.z.ai'

          curl --location --silent --show-error --retry 3 \
            --cookie-jar out/cookies.txt \
            --header 'Accept: application/json' \
            "$BASE/api/v1/auths/" \
            --output out/auth.json

          TOKEN="$(python - <<'PY'
          import json
          with open('out/auth.json', encoding='utf-8') as f:
              data=json.load(f)
          print(data.get('token') or data.get('user',{}).get('token') or '')
          PY
          )"

          curl --fail --location --silent --show-error --retry 3 \
            'https://r.jina.ai/http://chat.z.ai/s/8d6d58cc-f6ae-4e24-81bf-c4ff094e1401' \
            --output out/reader.md || true

          curl --location --silent --show-error --retry 3 \
            --cookie out/cookies.txt --cookie-jar out/cookies.txt \
            "$BASE/s/$SHARE_ID" \
            --output out/share.html

          curl --location --silent --show-error --retry 3 \
            --cookie out/cookies.txt \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/chats/share/$SHARE_ID" \
            --output out/api.json

          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/api.json').read_text(encoding='utf-8'))
          msgs=((d.get('chat') or {}).get('history') or {}).get('messages') or {}
          Path('out/message_ids.json').write_text(json.dumps(list(msgs), ensure_ascii=False), encoding='utf-8')
          print('message ids:', len(msgs))
          PY

          curl --location --silent --show-error --retry 3 \
            --request POST \
            --cookie out/cookies.txt \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $TOKEN" \
            --data-binary @<(python - <<'PY'
          import json
          print(json.dumps({'ids': json.load(open('out/message_ids.json'))}))
          PY
          ) \
            "$BASE/api/v1/chats/$SHARE_ID/messages/batch" \
            --output out/messages.json

          printf '\nFetched byte counts:\n'
          wc -c out/*
          test -s out/messages.json
      - name: Render Mermaid diagrams
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          mkdir -p out/diagrams
          cat > out/puppeteer-config.json <<'JSON'
          {"args":["--no-sandbox","--disable-setuid-sandbox"]}
          JSON
          for f in .tmp-zai-mermaid/*.mmd; do
            name="$(basename "$f" .mmd)"
            npx -y @mermaid-js/mermaid-cli@11.9.0 \
              -p out/puppeteer-config.json \
              -i "$f" -o "out/diagrams/${name}.png" \
              -w 2200 -H 1600 -b white
          done
          file out/diagrams/*
      - name: Upload fetched sources
        uses: actions/upload-artifact@v4
        with:
          name: zai-share-source-complete
          path: out/
          if-no-files-found: error
          retention-days: 1
