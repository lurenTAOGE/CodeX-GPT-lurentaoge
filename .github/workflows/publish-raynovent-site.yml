name: Publish Raynovent Interaction Site

on:
  push:
    branches: [main]
    paths:
      - 'raynovent-leritrelvir-interactions/**'
      - '.github/workflows/publish-raynovent-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: raynovent-leritrelvir-interactions

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful deployment
        uses: actions/checkout@v6
      - name: Write deployment marker
        run: |
          mkdir -p .deployment
          printf 'status=success\nurl=%s\ncommit=%s\n' "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}" > .deployment/raynovent-pages.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deployment/raynovent-pages.txt
          git commit -m 'Record Raynovent Pages deployment' || exit 0
          git push
